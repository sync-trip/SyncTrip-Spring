name: Deploy - School Runner

on:
  # GitHub Actions 화면에서 수동 배포 버튼 실행
  workflow_dispatch:
  # main 브랜치 CI가 성공 완료되면 자동 배포 트리거
  workflow_run:
    workflows: ["CI - Spring Boot Test"]
    types: [completed]
    branches: [main, dev]

jobs:
  deploy:
    name: Deploy on self-hosted runner
    # 수동/자동 배포 모두 main, dev 브랜치만 허용
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev'))
    # 실제 배포가 수행될 러너(학교 컴)
    runs-on: [self-hosted, Windows]
    # 동시에 여러 배포가 겹치지 않게 제어
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
      cancel-in-progress: true
    env:
      # 앱 이미지 태그(자동 배포는 CI 통과 커밋 SHA)
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # ===== SECRETS (GitHub Secrets에 저장해야 함) =====

      # DB 접속 정보(없으면 compose.yml 기본값 사용)
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      # 카카오/JWT 공통 시크릿
      KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      # 구글 지도 API 키 주입 추가
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      # ExchangeRate-API 키 (다통화 환율)
      EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
      # Gemini Vision API 키 (영수증 OCR)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Firebase 서비스 계정 JSON (base64 인코딩, FCM 푸시 알림)
      FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
      # Redis 비밀번호 (미설정 시 인증 없이 동작)
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      # ===== VARIABLES (GitHub Variables에 저장해야 함) =====

      # JWT 설정값 (공개 설정)
      JWT_ISSUER: ${{ vars.JWT_ISSUER }}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${{ vars.JWT_ACCESS_TOKEN_TTL_SECONDS }}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${{ vars.JWT_REFRESH_TOKEN_TTL_SECONDS }}
      # 브랜치별 Redirect URI(최종 선택은 아래 단계에서 수행)
      KAKAO_REDIRECT_URI_MAIN: ${{ vars.KAKAO_REDIRECT_URI_MAIN }}
      KAKAO_REDIRECT_URI_DEV: ${{ vars.KAKAO_REDIRECT_URI_DEV }}
      # 브랜치별 초대 링크 도메인(값은 GitHub Variables 또는 Secrets에 저장)
      APP_INVITE_SHARE_BASE_URL_MAIN: ${{ vars.APP_INVITE_SHARE_BASE_URL_MAIN }}
      APP_INVITE_SHARE_BASE_URL_DEV: ${{ vars.APP_INVITE_SHARE_BASE_URL_DEV }}
      APP_INVITE_DEEP_LINK_BASE_URL_MAIN: ${{ vars.APP_INVITE_DEEP_LINK_BASE_URL_MAIN }}
      APP_INVITE_DEEP_LINK_BASE_URL_DEV: ${{ vars.APP_INVITE_DEEP_LINK_BASE_URL_DEV }}

    steps:
      # 배포할 소스 코드 체크아웃 (자동 배포는 CI 통과한 정확한 커밋)
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # 필수 시크릿/변수가 비어 있으면 초기에 실패시켜 원인 파악을 쉽게 함
      - name: Validate required secrets and vars
        shell: pwsh
        run: |
          $required = @(
            'MYSQL_ROOT_PASSWORD', 'MYSQL_DATABASE', 'MYSQL_USER', 'MYSQL_PASSWORD',
            'KAKAO_CLIENT_ID', 'KAKAO_CLIENT_SECRET', 'JWT_SECRET', 'JWT_ISSUER',
            'JWT_ACCESS_TOKEN_TTL_SECONDS', 'JWT_REFRESH_TOKEN_TTL_SECONDS',
            'KAKAO_REDIRECT_URI_MAIN', 'KAKAO_REDIRECT_URI_DEV',
            'APP_INVITE_SHARE_BASE_URL_MAIN', 'APP_INVITE_SHARE_BASE_URL_DEV',
            'APP_INVITE_DEEP_LINK_BASE_URL_MAIN', 'APP_INVITE_DEEP_LINK_BASE_URL_DEV',
            'GOOGLE_MAPS_API_KEY', 'GOOGLE_OAUTH_CLIENT_ID',
            'EXCHANGE_RATE_API_KEY',
            'GEMINI_API_KEY',
            'FIREBASE_CREDENTIALS_JSON'
          )
          foreach ($key in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item -Path "Env:$key" -ErrorAction SilentlyContinue).Value)) {
              throw "Required secret/env is missing: $key"
            }
          }
      # 배포 대상 브랜치(main/dev)에 따라 컨테이너 이름/포트를 분리
      - name: Set deployment target variables
        shell: pwsh
        run: |
          $targetBranch = if ('${{ github.event_name }}' -eq 'workflow_run') { '${{ github.event.workflow_run.head_branch }}' } else { '${{ github.ref_name }}' }
          if ($targetBranch -notin @('main', 'dev')) {
            throw "Unsupported branch for deploy: $targetBranch"
          }
          if ($targetBranch -eq 'main') {
            $appContainer = 'synctrip-backend'
            $appImage = 'synctrip-main'
            $mysqlContainer = 'synctrip-mysql'
            $redisContainer = 'synctrip-redis'
            $appHostPort = '8080'
            $mysqlHostPort = '3306'
            $redisHostPort = '6379'
            $composeProject = 'synctrip-main'
            $kakaoRedirectUri = $env:KAKAO_REDIRECT_URI_MAIN
            $inviteShareBaseUrl = $env:APP_INVITE_SHARE_BASE_URL_MAIN
            $inviteDeepLinkBaseUrl = $env:APP_INVITE_DEEP_LINK_BASE_URL_MAIN
            $springProfile = 'prod'
            $appSecurityEnabled = 'true'
          } else {
            $appContainer = 'synctrip-backend-dev'
            $appImage = 'synctrip-dev'
            $mysqlContainer = 'synctrip-mysql-dev'
            $redisContainer = 'synctrip-redis-dev'
            $appHostPort = '8081'
            $mysqlHostPort = '3307'
            $redisHostPort = '6380'
            $composeProject = 'synctrip-dev'
            $kakaoRedirectUri = $env:KAKAO_REDIRECT_URI_DEV
            $inviteShareBaseUrl = $env:APP_INVITE_SHARE_BASE_URL_DEV
            $inviteDeepLinkBaseUrl = $env:APP_INVITE_DEEP_LINK_BASE_URL_DEV
            $springProfile = 'dev'
            $appSecurityEnabled = 'false'
          }
          if ([string]::IsNullOrWhiteSpace($kakaoRedirectUri)) {
            throw "KAKAO_REDIRECT_URI is empty for branch: $targetBranch"
          }
          if ([string]::IsNullOrWhiteSpace($inviteShareBaseUrl)) {
            throw "APP_INVITE_SHARE_BASE_URL is empty for branch: $targetBranch"
          }
          if ([string]::IsNullOrWhiteSpace($inviteDeepLinkBaseUrl)) {
            throw "APP_INVITE_DEEP_LINK_BASE_URL is empty for branch: $targetBranch"
          }
          "TARGET_BRANCH=$targetBranch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_CONTAINER_NAME=$appContainer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_IMAGE_NAME=$appImage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MYSQL_CONTAINER_NAME=$mysqlContainer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REDIS_CONTAINER_NAME=$redisContainer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_HOST_PORT=$appHostPort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MYSQL_HOST_PORT=$mysqlHostPort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REDIS_HOST_PORT=$redisHostPort" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMPOSE_PROJECT=$composeProject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # main/dev 배포에 맞는 Redirect URI를 최종 확정해서 컨테이너로 주입
          "KAKAO_REDIRECT_URI=$kakaoRedirectUri" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # main/dev 배포에 맞는 초대 링크 도메인을 컨테이너로 주입
          "APP_INVITE_SHARE_BASE_URL=$inviteShareBaseUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_INVITE_DEEP_LINK_BASE_URL=$inviteDeepLinkBaseUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # main은 prod 프로파일, dev는 dev 프로파일 활성화
          "SPRING_PROFILES_ACTIVE=$springProfile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # main은 보안 ON, dev는 보안 OFF
          "APP_SECURITY_ENABLED=$appSecurityEnabled" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Docker 엔진이 정상인지 사전 확인
      - name: Check Docker is available
        shell: pwsh
        run: |
          docker --version
          docker compose version
          docker info
      # 이전 배포에서 남아 있던 고정 이름 컨테이너가 있으면 먼저 정리
      - name: Remove old containers if they exist
        shell: pwsh
        run: |
          $names = @($env:APP_CONTAINER_NAME, $env:MYSQL_CONTAINER_NAME, $env:REDIS_CONTAINER_NAME)
          foreach ($name in $names) {
            $existing = docker ps -a --filter "name=^/$name$" --format "{{.Names}}"
            if ($existing -match "^$name$") {
              Write-Host "Removing old container: $name"
              docker stop $name | Out-Null
              docker rm $name | Out-Null
            }
          }
      # compose 파일을 실제 값으로 렌더링해서 문법/변수 오류 확인
      - name: Validate Docker Compose file
        shell: pwsh
        run: |
          docker compose -p $env:COMPOSE_PROJECT -f ./synctrip/compose.yml config | Out-Null
      # Docker 리소스 상태 미리 확인
      - name: Check Docker Resources
        shell: pwsh
        run: |
          docker info
          docker stats --no-stream
      # app + mysql을 함께 배포(필요 시 app 이미지를 새로 빌드)
      - name: Deploy with Docker Compose
        shell: pwsh
        timeout-minutes: 10  # 10분 지나도 안 끝나면 강제 종료
        run: |
          # --verbose를 붙여 어떤 단계에서 멈추는지 상세 확인
          docker compose --verbose -p $env:COMPOSE_PROJECT -f ./synctrip/compose.yml up -d --build --remove-orphans
      # app/mysql 컨테이너 상태 + /actuator/health(UP) 확인
      - name: Verify services and health endpoint
        shell: pwsh
        run: |
          Write-Host "컨테이너들이 완전히 켜질 때까지 40초 대기합니다..."
          Start-Sleep -Seconds 40
          $appRunning = docker ps --filter "name=$env:APP_CONTAINER_NAME" --filter "status=running" --format "{{.Names}}"
          if (-not ($appRunning -match "^$env:APP_CONTAINER_NAME$")) {
            Write-Host "백엔드 컨테이너가 실행 중이 아닙니다! (에러 로그 확인)"
            Write-Host "==================== [ 백엔드 로그 ] ===================="
            docker logs $env:APP_CONTAINER_NAME
            Write-Host "==================== [ MySQL 로그 ] ===================="
            docker logs $env:MYSQL_CONTAINER_NAME
            throw "Backend container is not running after deploy."
          }
          $mysqlRunning = docker ps --filter "name=$env:MYSQL_CONTAINER_NAME" --filter "status=running" --format "{{.Names}}"
          if (-not ($mysqlRunning -match "^$env:MYSQL_CONTAINER_NAME$")) {
            throw "MySQL container is not running after deploy."
          }
          $redisRunning = docker ps --filter "name=$env:REDIS_CONTAINER_NAME" --filter "status=running" --format "{{.Names}}"
          if (-not ($redisRunning -match "^$env:REDIS_CONTAINER_NAME$")) {
            Write-Host "==================== [ Redis 로그 ] ===================="
            docker logs $env:REDIS_CONTAINER_NAME
            throw "Redis container is not running after deploy."
          }
          $portCheck = Test-NetConnection -ComputerName 127.0.0.1 -Port $env:APP_HOST_PORT
          if (-not $portCheck.TcpTestSucceeded) {
            throw "Backend is running, but port $env:APP_HOST_PORT is not accepting connections."
          }
          $healthUrl = "http://127.0.0.1:$env:APP_HOST_PORT/actuator/health"
          $maxRetry = 10
          $retryDelaySec = 3
          $isHealthy = $false
          for ($i = 1; $i -le $maxRetry; $i++) {
            try {
              $health = Invoke-RestMethod -Uri $healthUrl -Method Get -TimeoutSec 5
              if ($health.status -eq 'UP') {
                $isHealthy = $true
                break
              }
              Write-Host "Health check attempt ${i}/${maxRetry}: status='$($health.status)'"
            } catch {
              Write-Host "Health check attempt ${i}/${maxRetry} failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds $retryDelaySec
          }
          if (-not $isHealthy) {
            Write-Host "헬스 체크 실패! 서버 로그를 확인합니다."
            docker logs $env:APP_CONTAINER_NAME
            throw "Health endpoint is not UP after deploy: $healthUrl"
          }
          Write-Host "✅ 배포가 성공적으로 완료되었습니다! '$env:TARGET_BRANCH': backend/mysql are running, port $env:APP_HOST_PORT is open, and actuator health is UP."

      # 실패 시에도 로그를 볼 수 있도록 진단 로그 출력
      - name: Show logs on failure
        if: failure()
        shell: pwsh
        run: |
          docker ps -a
          docker logs $env:MYSQL_CONTAINER_NAME
          docker logs $env:APP_CONTAINER_NAME
