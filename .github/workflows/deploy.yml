name: Deploy - School Runner

on:
  # GitHub Actions 화면에서 수동 배포 버튼 실행
  workflow_dispatch:
  # main 브랜치 CI가 성공 완료되면 자동 배포 트리거
  workflow_run:
    workflows: ["CI - Spring Boot Test"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy on self-hosted runner
    # 수동 배포는 main에서만 허용, 자동 배포는 main CI 성공 시만 허용
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    # 실제 배포가 수행될 러너(학교 컴)
    runs-on: [self-hosted, Windows]
    # 동시에 여러 배포가 겹치지 않게 제어
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    env:
      # 앱 이미지 태그(자동 배포는 CI 통과 커밋 SHA)
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      # DB 접속 정보(없으면 compose.yml 기본값 사용)
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_DATABASE: synctripdb
      MYSQL_USER: synctrip
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

    steps:
      # 배포할 소스 코드 체크아웃 (자동 배포는 CI 통과한 정확한 커밋)
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # 필수 시크릿/변수가 비어 있으면 초기에 실패시켜 원인 파악을 쉽게 함
      - name: Validate required secrets
        shell: powershell
        run: |
          $required = @('MYSQL_ROOT_PASSWORD', 'MYSQL_DATABASE', 'MYSQL_USER', 'MYSQL_PASSWORD')
          foreach ($key in $required) {
            if ([string]::IsNullOrWhiteSpace((Get-Item -Path "Env:$key" -ErrorAction SilentlyContinue).Value)) {
              throw "Required secret/env is missing: $key"
            }
          }

      # Docker 엔진이 정상인지 사전 확인
      - name: Check Docker is available
        shell: powershell
        run: |
          docker --version
          docker compose version
          docker info

      # 이전 배포에서 남아 있던 고정 이름 컨테이너가 있으면 먼저 정리
      - name: Remove old containers if they exist
        shell: powershell
        run: |
          $names = @('synctrip-backend', 'synctrip-mysql')
          foreach ($name in $names) {
            $existing = docker ps -a --filter "name=^/$name$" --format "{{.Names}}"
            if ($existing -match "^$name$") {
              Write-Host "Removing old container: $name"
              docker stop $name | Out-Null
              docker rm $name | Out-Null
            }
          }

      # compose 파일을 실제 값으로 렌더링해서 문법/변수 오류 확인
      - name: Validate Docker Compose file
        shell: powershell
        run: |
          docker compose -f ./synctrip/compose.yml config | Out-Null

      # app + mysql을 함께 배포(필요 시 app 이미지를 새로 빌드)
      - name: Deploy with Docker Compose
        shell: powershell
        run: |
          docker compose -f ./synctrip/compose.yml up -d --build --remove-orphans

      # app/mysql 컨테이너 상태 + /actuator/health(UP) 확인
      - name: Verify services and health endpoint
        shell: powershell
        run: |
          Start-Sleep -Seconds 12

          $appRunning = docker ps --filter "name=synctrip-backend" --filter "status=running" --format "{{.Names}}"
          if (-not ($appRunning -match "^synctrip-backend$")) {
            throw "Backend container is not running after deploy."
          }

          $mysqlRunning = docker ps --filter "name=synctrip-mysql" --filter "status=running" --format "{{.Names}}"
          if (-not ($mysqlRunning -match "^synctrip-mysql$")) {
            throw "MySQL container is not running after deploy."
          }

          $portCheck = Test-NetConnection -ComputerName 127.0.0.1 -Port 8080
          if (-not $portCheck.TcpTestSucceeded) {
            throw "Backend is running, but port 8080 is not accepting connections."
          }

          $healthUrl = "http://127.0.0.1:8080/actuator/health"
          $maxRetry = 10
          $retryDelaySec = 3
          $isHealthy = $false

          for ($i = 1; $i -le $maxRetry; $i++) {
            try {
              $health = Invoke-RestMethod -Uri $healthUrl -Method Get -TimeoutSec 5
              if ($health.status -eq 'UP') {
                $isHealthy = $true
                break
              }
              Write-Host "Health check attempt $i/$maxRetry: status='$($health.status)'"
            } catch {
              Write-Host "Health check attempt $i/$maxRetry failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds $retryDelaySec
          }

          if (-not $isHealthy) {
            throw "Health endpoint is not UP after deploy: $healthUrl"
          }

          Write-Host "Deploy check passed: backend/mysql are running, port 8080 is open, and actuator health is UP."
