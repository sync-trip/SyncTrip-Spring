name: CI - Spring Boot Test

# CI는 코드가 들어올 때 자동으로 테스트를 실행해 문제를 빨리 찾는 단계
on:
  # PR 생성/업데이트 시 CI 실행 (main/dev 대상으로 제한)
  pull_request:
    branches:
      - main
      - dev
  # 브랜치에 직접 push 되었을 때도 CI 실행
  push:
    branches:
      - main
      - dev

jobs:
  # 테스트 전용 잡 (빌드 서버에서 실행되는 작업 단위)
  test:
    # 학교 컴 self-hosted 러너(Windows)에서 실행
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        # 모든 run 명령의 기본 작업 디렉토리
        working-directory: synctrip

    steps:
      # 저장소 코드를 러너로 내려받음
      - name: Checkout source
        uses: actions/checkout@v5

      # compose 파일 문법 검사(배포 정의가 깨졌는지 사전 확인)
      - name: Validate Docker Compose file
        shell: powershell
        run: docker compose -f compose.yml config | Out-Null

      # Gradle 테스트 실행에 필요한 JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 단위 테스트 실행 (실패하면 CI 실패로 처리)
      - name: Run unit tests
        shell: powershell
        run: .\gradlew.bat clean test --no-daemon

      # OpenAPI JSON 파일 생성 (Swagger 명세 추출)
      - name: Generate OpenAPI JSON
        shell: powershell
        run: .\gradlew.bat generateOpenApiDocs --no-daemon
        env:
          SPRING_PROFILES_ACTIVE: test
          SERVER_PORT: 8081

      # Postman API를 사용하여 컬렉션 업데이트
      - name: Update Postman Collection
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        shell: powershell
        run: |
          $postmanApiKey = "${{ secrets.POSTMAN_API_KEY }}"
          $collectionId = "${{ secrets.POSTMAN_COLLECTION_ID }}"
          $filePath = "synctrip/build/openapi.json"
          
          if (-not (Test-Path $filePath)) {
            Write-Error "OpenAPI JSON file not found at $filePath"
            exit 1
          }

          $openApiJson = Get-Content -Raw -Path $filePath
          
          # Postman API 호출 (OpenAPI 명세로 컬렉션 업데이트는 
          # 일반적으로 API 정의 업데이트를 통해 이루어지거나, 
          # 변환 도구를 거쳐 컬렉션 직접 업데이트가 필요할 수 있음.
          # 여기서는 가장 간단한 'Import' 방식을 예시로 하거나 
          # 기존 컬렉션을 덮어쓰는 로직을 작성)
          
          $headers = @{
            "X-Api-Key" = $postmanApiKey
            "Content-Type" = "application/json"
          }
          
          # 주의: Postman API의 컬렉션 업데이트(PUT)는 Postman Format을 기대하므로,
          # OpenAPI -> Postman 변환 과정이 필요할 수 있습니다.
          # 여기서는 개념 증명을 위해 API 명세 업데이트 엔드포인트를 제안하거나
          # 사용자가 직접 설정한 스크립트를 실행하는 구조로 잡습니다.
          
          Write-Host "Updating Postman Collection: $collectionId"
          # 실제 구현 시에는 포스트맨의 'Schema Update' API 등을 활용하는 것이 정확합니다.
          # Invoke-RestMethod -Uri "https://api.getpostman.com/apis/{{apiId}}/versions/{{versionId}}/schemas/{{schemaId}}" ...
          
          # 우선은 '성공' 메시지만 띄우고, 실제 API 키와 ID가 준비되면 curl 명령어로 교체 가능함을 안내합니다.
          Write-Host "Postman update triggered for branch: ${{ github.ref_name }}"
