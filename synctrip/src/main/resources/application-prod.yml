spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 보안 설정: 환경별로 다르게 적용됨
app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}  # 기본: 개발 모드 (비활성화)
    public-paths:
      - /api/auth/**
      - /debug/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /actuator/**
  invite:
    # 운영 환경에서는 실제 프로젝트 도메인으로 공유 링크를 생성한다.
    share-base-url: ${APP_INVITE_SHARE_BASE_URL:https://api.sync-trip.app/invite?code=}
    # 딥링크는 앱 스킴을 사용하므로 dev/prod 모두 동일하게 유지한다.
    deep-link-base-url: ${APP_INVITE_DEEP_LINK_BASE_URL:synctrip://band/join?code=}

logging:
  level:
    root: info
    com.sync: info

