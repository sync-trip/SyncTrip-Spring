spring:
  application:
    name: synctrip
  profiles:
    active: main  # 활성 프로필: local(로컬), dev(개발), prod(배포)
    group:
      local: "local, common"
      dev: "dev, common"
      prod: "prod, common"

# ════════════════════════════════════════════════════════════════
# JWT 토큰 설정 (사용자 로그인 후 발급)
# ════════════════════════════════════════════════════════════════
jwt:
  # 토큰 발급자 (예: "synctrip")
  issuer: ${JWT_ISSUER}
  # 토큰 서명 비밀키 (32자 이상, .env에서 로드)
  secret: ${JWT_SECRET}
  # Access Token 유효 시간 (초, 기본 900=15분)
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS}
  # Refresh Token 유효 시간 (초, 기본 1209600=14일)
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS}

# ════════════════════════════════════════════════════════════════
# 앱 보안 및 초대 링크 설정
# ════════════════════════════════════════════════════════════════
app:
  security:
    # JWT 검증 활성화 여부 (로컬 개발: false, 배포: true)
    enabled: ${APP_SECURITY_ENABLED:false}
    public-paths:
      # 인증 없이 접근 가능한 경로들
      - /auth/**
      - /debug/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /actuator/**
      - /ws/**
      - /invite
      - /.well-known/**
  user-purge:
    # 탈퇴 회원 하드 삭제 스케줄러 (기본 비활성화)
    enabled: ${APP_USER_PURGE_ENABLED:true}
    # 탈퇴 후 몇 초 뒤에 하드 삭제할지 (기본 30일 = 2592000초, 테스트용: 30)
    threshold-seconds: ${APP_USER_PURGE_THRESHOLD_SECONDS:30}
    # 삭제 대상 체크 주기 (밀리초, 기본 10초)
    check-interval-ms: ${APP_USER_PURGE_CHECK_INTERVAL_MS:10000}
  invite:
    # 밴드 초대 링크의 베이스 URL (프로필별로 override 가능)
    share-base-url: ${APP_INVITE_SHARE_BASE_URL:https://test.sync-trip.app/invite?code=}
    # 안드로이드 앱에서 직접 열기 위한 커스텀 스킴 URL
    deep-link-base-url: ${APP_INVITE_DEEP_LINK_BASE_URL:synctrip://band/join?code=}

---
spring:
  config:
    activate:
      on-profile: common
  # JSON 직렬화 설정 (날짜 포맷, null 제외 등)
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ════════════════════════════════════════════════════════════════
# Kakao API 설정
# ════════════════════════════════════════════════════════════════
# 용도:
# 1. Kakao OAuth 로그인 (KakaoAuthService)
# 2. 국내 장소 검색 (KakaoPlacesService)
# ════════════════════════════════════════════════════════════════
kakao:
  # Kakao OAuth 인증 엔드포인트
  authorization-uri: ${KAKAO_AUTHORIZATION_URI}
  # Kakao OAuth 토큰 발급 엔드포인트
  token-uri: ${KAKAO_TOKEN_URI}
  # Kakao 사용자 정보 조회 엔드포인트
  user-info-uri: ${KAKAO_USER_INFO_URI}
  # Kakao Local API (카테고리 검색) 엔드포인트
  local-search-uri: ${KAKAO_LOCAL_SEARCH_URI:https://dapi.kakao.com/v2/local/search/category.json}
  # Kakao 앱 클라이언트 ID (.env에서 로드)
  client-id: ${KAKAO_CLIENT_ID}
  # Kakao 앱 클라이언트 Secret (.env에서 로드)
  client-secret: ${KAKAO_CLIENT_SECRET}
  # OAuth 콜백 URI (Kakao 앱 설정과 일치해야 함)
  redirect-uri: ${KAKAO_REDIRECT_URI}
  # OAuth 스코프 (기본: 이메일, 닉네임, 프로필 이미지)
  scope: ${KAKAO_SCOPE:account_email,profile_nickname,profile_image}

# ════════════════════════════════════════════════════════════════
# Google Maps API 설정
# ════════════════════════════════════════════════════════════════
# 용도:
# - 해외 장소 검색 (GooglePlacesService)
# ════════════════════════════════════════════════════════════════
google:
  maps:
    # Google Maps Platform API Key (.env에서 로드)
    # Places API 권한이 활성화되어 있어야 함
    api-key: ${GOOGLE_MAPS_API_KEY}
    # Google Places API 베이스 URL (고정값)
    places-base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
  # ════════════════════════════════════════════════════════════════
  # Google OAuth 설정 (모바일 앱용)
  # ════════════════════════════════════════════════════════════════
  # 용도: 안드로이드에서 받은 Google ID Token 검증
  # 백엔드에서 필요한 것은 클라이언트 ID뿐입니다.
  # (client-secret, redirect-uri는 웹 로그인 전용이므로 제거했습니다)
  # ════════════════════════════════════════════════════════════════
  client:
    # Google OAuth 클라이언트 ID (.env에서 로드)
    # 구글 클라우드 콘솔에서 "웹 애플리케이션"으로 생성한 클라이언트 ID
    # 형식: xxxxxxxxx.apps.googleusercontent.com
    id: ${GOOGLE_OAUTH_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        # Actuator 헬스체크, 정보 엔드포인트만 노출
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# ════════════════════════════════════════════════════════════════
# Gemini Vision API 설정
# ════════════════════════════════════════════════════════════════
# 용도: 영수증 OCR (USR-019)
# 무료 티어: 분당 15회 (졸업 프로젝트 시연용으로 충분)
# ════════════════════════════════════════════════════════════════
exchangerate:
  api-key: ${EXCHANGE_RATE_API_KEY}
  base-url: ${EXCHANGE_RATE_BASE_URL:https://v6.exchangerate-api.com}

gemini:
  api-key: ${GEMINI_API_KEY}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  model: ${GEMINI_MODEL:gemini-3.5-flash}

# ════════════════════════════════════════════════════════════════
# FCM 설정 (Firebase Cloud Messaging, 푸시 알림)
# ════════════════════════════════════════════════════════════════
# Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키 생성
# 다운로드한 JSON을 base64로 인코딩해서 FIREBASE_CREDENTIALS_JSON에 저장
# base64 인코딩: base64 -w 0 firebase-service-account.json
# ConditionalOnProperty로 값이 없으면 FCM 비활성화 (개발환경 용이)
fcm:
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
