spring:
  application:
    name: synctrip
  profiles:
    group:
      local: "local, common"
      prod: "prod, common"

jwt:
  issuer: ${JWT_ISSUER:synctrip}
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-32-bytes}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}

---
spring:
  config:
    activate:
      on-profile: common
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

kakao:
  authorization-uri: ${KAKAO_AUTHORIZATION_URI:https://kauth.kakao.com/oauth/authorize}
  token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
  user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  scope: ${KAKAO_SCOPE:account_email,profile_nickname,profile_image}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    places-base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
