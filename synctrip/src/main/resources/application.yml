spring:
  application:
    name: synctrip
  profiles:
    active: dev  # 기본 프로필: dev (개발)
    group:
      local: "local, common"
      prod: "prod, common"

jwt:
  issuer: ${JWT_ISSUER:synctrip}
  secret: ${JWT_SECRET}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}

# 보안 설정: 환경별로 다르게 적용됨
app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}  # 기본: 개발 모드 (비활성화)
    public-paths:
      - /api/auth/**
      - /debug/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /actuator/**

---
spring:
  config:
    activate:
      on-profile: common
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

kakao:
  authorization-uri: ${KAKAO_AUTHORIZATION_URI:https://kauth.kakao.com/oauth/authorize}
  token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
  user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  scope: ${KAKAO_SCOPE:account_email,profile_nickname,profile_image}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
