spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.sync: DEBUG
    # org.springframework.web을 DEBUG로 두면 RestTemplate이 외부 API 요청 URL/헤더
    # (Google/Gemini API 키 포함)와 응답 본문(사진 base64 등)을 통째로 로깅한다.
    # 키 노출·로그 폭증 방지를 위해 INFO로 유지한다.
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# dev 환경: 보안 기능 OFF (개발 편의성 우선)
# 보안 설정: 환경별로 다르게 적용됨
app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}  # 기본: 개발 모드 (비활성화)
    public-paths:
      - /auth/**
      - /debug/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /actuator/**
      - /ws/**
  invite:
    # dev 환경에서는 테스트 도메인으로 공유 링크를 생성한다.
    share-base-url: ${APP_INVITE_SHARE_BASE_URL:https://test.sync-trip.app/invite?code=}
    # 딥링크는 앱 스킴을 사용하므로 dev/prod 모두 동일하게 유지한다.
    deep-link-base-url: ${APP_INVITE_DEEP_LINK_BASE_URL:synctrip://band/join?code=}
# dev 환경: 모든 엔드포인트 노출(actuator, swagger 등)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics



