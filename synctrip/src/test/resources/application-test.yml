spring:
  datasource:
    url: jdbc:h2:mem:synctrip;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  issuer: ${JWT_ISSUER:synctrip}
  secret: ${JWT_SECRET:test-secret-key-at-least-32-characters-long-12345999}
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:86400}

# 보안 설정: 테스트 환경에서도 실제 배포와 동일하게 보안(JWT) 활성화
app:
  security:
    enabled: ${APP_SECURITY_ENABLED:false}
    public-paths:
      - /auth/**
      - /debug/**
      - /swagger-ui/**
      - /v3/api-docs/**
      - /actuator/**
  invite:
    share-base-url: https://test.sync-trip.app/invite?code=
    deep-link-base-url: synctrip://band/join?code=

kakao:
  authorization-uri: https://kauth.kakao.com/oauth/authorize
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  local-search-uri: https://dapi.kakao.com/v2/local/search/category.json
  client-id: test-client-id
  client-secret: test-client-secret
  redirect-uri: https://test.sync-trip.app/api/auth/kakao/callback
  scope: account_email,profile_nickname,profile_image

exchangerate:
  api-key: test-exchange-rate-api-key
  base-url: https://v6.exchangerate-api.com

gemini:
  api-key: test-gemini-api-key
  base-url: https://generativelanguage.googleapis.com
  model: gemini-3.5-flash

# FCM 미설정 → Firebase 초기화 안 함 (ConditionalOnProperty)
# fcm.credentials-json 미설정 시 FcmService는 로그만 출력하고 건너뜀
google:
  maps:
    api-key: test-google-maps-api-key
    places-base-url: https://places.googleapis.com

