# Compose 파일 버전 선언은 최신 Docker Compose V2에서는 생략 가능

services:
  # MySQL 데이터베이스 컨테이너
  mysql:
    # 사용할 MySQL 이미지와 버전
    image: mysql:8.0
    # 컨테이너 이름(브랜치별 분리를 위해 환경변수로 주입 가능)
    container_name: ${MYSQL_CONTAINER_NAME:-synctrip-mysql}
    # 서버 재부팅/프로세스 종료 후 자동 재시작
    restart: unless-stopped
    environment:
      # 루트 계정 비밀번호(환경변수 없으면 기본값 사용)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 최초 생성할 데이터베이스 이름
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # 애플리케이션 전용 DB 계정
      MYSQL_USER: ${MYSQL_USER}
      # 애플리케이션 전용 DB 계정 비밀번호
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 문자셋/콜레이션을 UTF-8 계열로 고정
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 호스트 포트는 환경변수로 분리(main/dev 동시 구동 대비)
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      # 호스트의 초기 SQL 파일들을 MySQL 시작 시 자동 실행
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d
      # DB 데이터를 볼륨에 저장해서 컨테이너 재생성 시에도 유지
      - synctrip-mysql-data:/var/lib/mysql
    healthcheck:
      # MySQL이 실제로 연결 가능한 상태인지 체크
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Spring Boot 백엔드 컨테이너
  app:
    build:
      # compose.yml 기준 현재 폴더(synctrip)를 빌드 컨텍스트로 사용
      context: .
      # 위 컨텍스트 안의 Dockerfile 사용
      dockerfile: Dockerfile
    # 빌드 결과 이미지 이름
    # - 브랜치별로 구분하려면 APP_IMAGE_NAME을 다르게 주입
    # - 예: main -> synctrip-backend-main, dev -> synctrip-backend-dev
    image: ${APP_IMAGE_NAME:-synctrip-backend}:${IMAGE_TAG:-latest}
    # 컨테이너 이름(브랜치별 분리를 위해 환경변수로 주입 가능)
    container_name: ${APP_CONTAINER_NAME:-synctrip-backend}
    # 서버 재부팅/프로세스 종료 후 자동 재시작
    restart: unless-stopped
    depends_on:
      # MySQL이 healthy 상태가 된 뒤 app 시작
      mysql:
        condition: service_healthy
    environment:
      # 운영 프로파일 활성화 (배포 환경에 따라 dev 또는 prod)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 앱 컨테이너에서 DB 주소는 localhost가 아니라 서비스명(mysql)
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      # DB 사용자/비밀번호 주입
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # 카카오 OAuth 설정 주입
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      KAKAO_AUTHORIZATION_URI: ${KAKAO_AUTHORIZATION_URI:-https://kauth.kakao.com/oauth/authorize}
      KAKAO_TOKEN_URI: ${KAKAO_TOKEN_URI:-https://kauth.kakao.com/oauth/token}
      KAKAO_USER_INFO_URI: ${KAKAO_USER_INFO_URI:-https://kapi.kakao.com/v2/user/me}
      KAKAO_SCOPE: ${KAKAO_SCOPE:-account_email,profile_nickname,profile_image}
      # 초대 링크 설정 주입(브랜치별로 배포 워크플로우에서 최종값을 결정)
      APP_INVITE_SHARE_BASE_URL: ${APP_INVITE_SHARE_BASE_URL:-https://test.sync-trip.app/invite?code=}
      APP_INVITE_DEEP_LINK_BASE_URL: ${APP_INVITE_DEEP_LINK_BASE_URL:-synctrip://band/join?code=}
      # 보안 활성화 여부 (브랜치별로 다르게 설정됨: main=true, dev=false)
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED}
      # 내부 JWT 발급 설정 주입
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-synctrip}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-1209600}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    ports:
      # 호스트 포트는 환경변수로 분리(main/dev 동시 구동 대비)
      - "${APP_HOST_PORT:-8080}:8080"

volumes:
  # MySQL 영구 저장 볼륨 이름
  synctrip-mysql-data:

